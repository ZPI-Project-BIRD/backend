syntax = "proto3";

package downloader.v1;

option go_package = "bird-zpi/downloader/gen/downloader/v1;downloaderv1";
option java_package = "zpi.project_bird.backend.downloader.v1";
option java_multiple_files = true;

service DownloaderService {
  rpc CreateDownload(CreateDownloadRequest) returns (CreateDownloadResponse);
  rpc RetryFeature(RetryFeatureRequest) returns (RetryFeatureResponse);
}

message CreateDownloadRequest {
  string layer = 1;
  string project_id = 2;
}

message CreateDownloadResponse {}

message RetryFeatureRequest {
  string feature_id = 1;
  string project_id = 2;
}

message RetryFeatureResponse {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    DOWNLOAD_QUEUED = 1;
    TILING_QUEUED = 2;
    ALREADY_COMPLETE = 3;
  }

  Action action = 1;
}
