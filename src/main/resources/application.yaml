spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app

  data:
    redis:
      url: "${REDIS_URL:redis://localhost:6379}"

  session:
    timeout: 30d
    data:
      redis:
        namespace: "bird:sessions"

  jooq:
    sql-dialect: POSTGRES

downloader:
  feature-discovery-function-name: "${FEATURE_DISCOVERY_FUNCTION_NAME:feature-discovery}"

server:
  servlet:
    session:
      cookie:
        name: SESSION
        max-age: 120d
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
